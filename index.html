<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CineVault • Watchlist Tracker</title>

    <!-- ========== FAVICON ========== -->
    <!-- Place a 32x32 PNG file named "favicon.png" in the same folder, then update the path below -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-primary: #f5f2f0;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0ece9;
            --bg-glass: rgba(255, 255, 255, 0.75);
            --bg-glass-hover: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5e;
            --text-tertiary: #7a7a8e;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.2);
            --card-bg: #ffffff;
            --card-hover-bg: #fdfcfb;
            --input-bg: #f5f2f0;
            --input-border: #e0dcd7;
            --tag-watching: #ff6b6b;
            --tag-planning: #ffa94d;
            --tag-watched: #51cf66;
            --gradient-1: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --gradient-2: linear-gradient(135deg, #ff6b6b, #ffa94d);
            --gradient-3: linear-gradient(135deg, #51cf66, #69db7c);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --toast-bg: #1a1a2e;
            --toast-text: #fff;
            --star-empty: #d0d0d0;
            --star-filled: #ffc107;
            --ripple: rgba(108, 92, 231, 0.3);
            --particle-color: rgba(108, 92, 231, 0.15);
            --scrollbar-thumb: #c0bdb8;
            --scrollbar-track: transparent;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #222236;
            --bg-glass: rgba(26, 26, 46, 0.75);
            --bg-glass-hover: rgba(30, 30, 55, 0.9);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c0;
            --text-tertiary: #7a7a90;
            --accent: #8b7cf7;
            --accent-light: #b4a7ff;
            --accent-glow: rgba(139, 124, 247, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.6);
            --card-bg: #1e1e35;
            --card-hover-bg: #252540;
            --input-bg: #1a1a2e;
            --input-border: #333350;
            --nav-bg: rgba(15, 15, 26, 0.85);
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --toast-bg: #e8e8f0;
            --toast-text: #1a1a2e;
            --star-empty: #3a3a55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s;
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        /* --------- LOADING SCREEN ---------- */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .loader-logo {
            font-size: 4rem;
            animation: loaderPulse 1.5s infinite ease-in-out;
            margin-bottom: 1.5rem;
        }
        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .loader-bar {
            width: 200px;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--gradient-1);
            border-radius: 10px;
            animation: loaderFill 1.8s ease-in-out forwards;
        }
        @keyframes loaderFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --------- PARTICLES & GRID ---------- */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--particle-color);
            animation: floatUp linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        .grid-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03;
            background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridShift 20s linear infinite;
        }
        @keyframes gridShift {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* --------- APP CONTAINER ---------- */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --------- NAVBAR ---------- */
        .navbar {
            position: sticky;
            top: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            margin-top: 16px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            transition: all 0.4s;
            animation: slideDownNav 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideDownNav {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .nav-brand .logo-icon {
            width: 42px; height: 42px;
            border-radius: 14px;
            background: var(--gradient-1);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            animation: logoPulse 3s infinite;
        }
        @keyframes logoPulse {
            0%,100% { box-shadow: 0 4px 20px var(--accent-glow); }
            50% { box-shadow: 0 8px 35px var(--accent-glow); }
        }
        .nav-actions {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }

        /* --------- BUTTONS ---------- */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 18px; border: none; border-radius: 14px;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            transition: all 0.3s; position: relative; overflow: hidden;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--gradient-1); color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-outline {
            background: transparent; color: var(--text-primary);
            border: 2px solid var(--border);
        }
        .btn-icon {
            width: 42px; height: 42px; padding: 0; border-radius: 12px;
            background: var(--bg-glass); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 1.1rem;
        }
        .google-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; background: var(--bg-glass);
            border: 1px solid var(--border); border-radius: 14px;
            cursor: pointer; font-weight: 600; font-size: 0.9rem;
            color: var(--text-primary); transition: all 0.3s;
            white-space: nowrap;
        }
        .google-btn.signed-in {
            background: var(--gradient-1); color: #fff; border: none;
        }

        /* --------- STATS ---------- */
        .stats-bar {
            display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
        }
        .stat-card {
            flex: 1; min-width: 120px; padding: 18px 20px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 18px; text-align: center; transition: all 0.4s;
            cursor: pointer; box-shadow: var(--shadow-sm);
        }
        .stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem; font-weight: 700;
            background: var(--gradient-1); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* --------- TABS ---------- */
        .tabs-container {
            display: flex; gap: 6px; margin-bottom: 20px;
            background: var(--bg-tertiary); padding: 6px;
            border-radius: 16px; flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1; min-width: 90px; padding: 12px 16px;
            background: transparent; border: none; border-radius: 12px;
            font-weight: 600; font-size: 0.85rem; color: var(--text-secondary);
            cursor: pointer; transition: all 0.4s;
        }
        .tab-btn.active {
            background: var(--card-bg); color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* --------- CARD GRID ---------- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
            min-height: 200px;
        }
        .show-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 22px; transition: all 0.4s;
            cursor: pointer; box-shadow: var(--shadow-sm);
            animation: cardAppear 0.5s ease forwards;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --------- MODAL ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: var(--modal-overlay);
            z-index: 200; display: flex; align-items: center;
            justify-content: center; padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 24px; padding: 28px; width: 100%;
            max-width: 520px; max-height: 85vh; overflow-y: auto;
            box-shadow: var(--shadow-xl);
        }

        /* --------- TOAST ---------- */
        .toast-container {
            position: fixed; bottom: 24px; right: 24px; z-index: 300;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* Mobile refinements */
        @media (max-width: 768px) {
            .app-container { padding: 0 12px; }
            .navbar { padding: 12px 16px; border-radius: 16px; }
            .nav-brand { font-size: 1.1rem; gap: 6px; }
            .nav-brand .logo-icon { width: 34px; height: 34px; font-size: 1rem; }
            .btn { padding: 8px 14px; font-size: 0.8rem; }
            .google-btn span { display: none; }
            .card-grid {
                grid-template-columns: 1fr;
                max-height: 70vh;
                overflow-y: auto;
                padding-right: 4px;
            }
            .stat-card { padding: 12px; min-width: 80px; }
            .stat-number { font-size: 1.5rem; }
            .modal { margin: 10px; max-height: 90vh; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen">
        <div class="loader-logo">🎬</div>
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.5px;">CineVault</h2>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
        <p style="margin-top: 1rem; color: var(--text-secondary); font-size: 0.9rem;">Preparing your watchlist...</p>
    </div>

    <!-- PARTICLE BACKGROUND -->
    <div class="particles-container" id="particlesContainer"></div>
    <div class="grid-bg"></div>

    <!-- APP -->
    <div class="app-container">
        <nav class="navbar" id="navbar">
            <div class="nav-brand" onclick="location.reload()">
                <div class="logo-icon">🎬</div> <span>CineVault</span>
            </div>
            <div class="nav-actions">
                <button class="google-btn" id="googleSignBtn" onclick="handleGoogleSignIn()">
                    <i class="fa-brands fa-google"></i> <span>Sign In</span>
                </button>
                <button class="btn-icon" onclick="exportData()"><i class="fa-solid fa-download"></i></button>
                <button class="btn-icon" onclick="document.getElementById('importFileInput').click()"><i class="fa-solid fa-upload"></i></button>
                <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importData(event)">
                <button class="btn-icon" id="themeToggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
            </div>
        </nav>

        <div class="main-content" style="margin-top:28px;">
            <div class="stats-bar" id="statsBar">
                <div class="stat-card" onclick="switchTab('watching')"><span>👀</span><div class="stat-number" id="statWatching">0</div><small>Watching</small></div>
                <div class="stat-card" onclick="switchTab('planning')"><span>📋</span><div class="stat-number" id="statPlanning">0</div><small>Planned</small></div>
                <div class="stat-card" onclick="switchTab('watched')"><span>✅</span><div class="stat-number" id="statWatched">0</div><small>Watched</small></div>
                <div class="stat-card"><span>⭐</span><div class="stat-number" id="statAvgRating">0.0</div><small>Avg Rating</small></div>
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">All <span class="tab-badge" id="badgeAll">0</span></button>
                <button class="tab-btn" data-tab="watching" onclick="switchTab('watching')">Watching <span id="badgeWatching">0</span></button>
                <button class="tab-btn" data-tab="planning" onclick="switchTab('planning')">Planning <span id="badgePlanning">0</span></button>
                <button class="tab-btn" data-tab="watched" onclick="switchTab('watched')">Watched <span id="badgeWatched">0</span></button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                <h2 id="sectionTitle" style="font-family:'Space Grotesk',sans-serif;">All Entries</h2>
                <div style="display:flex; gap:8px; align-items:center;">
                    <select id="sortSelect" onchange="renderCards()" style="padding:10px; border-radius:12px; background:var(--input-bg); border:1px solid var(--input-border); color:var(--text-primary);">
                        <option value="newest">Newest</option><option value="oldest">Oldest</option>
                        <option value="rating-high">Rating: High</option><option value="title-asc">Title A-Z</option>
                    </select>
                    <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add</button>
                </div>
            </div>

            <div class="card-grid" id="cardGrid"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)">
        <div class="modal" id="modal" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 id="modalTitle">Add Entry</h3>
                <button onclick="closeModal()" style="background:var(--bg-glass); border:1px solid var(--border); border-radius:12px; width:36px; height:36px; cursor:pointer;">✕</button>
            </div>
            <form id="entryForm" onsubmit="saveEntry(event)">
                <input type="hidden" id="entryId"><input type="hidden" id="entryRating" value="0">
                <div style="margin-bottom:14px;"><label>Title *</label><input class="form-input" id="entryTitle" required></div>
                <div style="display:flex; gap:12px; margin-bottom:14px;">
                    <div style="flex:1;"><label>Type</label><select id="entryType" class="form-input"><option value="movie">Movie</option><option value="show">TV Show</option></select></div>
                    <div style="flex:1;"><label>Status</label><select id="entryStatus" class="form-input" onchange="handleStatusChange()"><option value="watching">Watching</option><option value="planning">Planning</option><option value="watched">Watched</option></select></div>
                </div>
                <div style="display:flex; gap:12px; margin-bottom:14px;">
                    <div style="flex:1;"><label>Start Date</label><input type="date" id="entryStartDate" class="form-input"></div>
                    <div style="flex:1;"><label>Finished Date</label><input type="date" id="entryFinishedDate" class="form-input"></div>
                </div>
                <div style="margin-bottom:14px;"><label>Rating</label><div id="starRatingInput" style="font-size:2rem; cursor:pointer;">★★★★★</div></div>
                <div style="margin-bottom:14px;"><label>Remarks</label><textarea id="entryRemarks" class="form-input" rows="3"></textarea></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Save Entry</button>
                <button type="button" id="deleteEntryBtn" style="display:none; width:100%; margin-top:8px; background:#ff475720; border:1px solid #ff4757; color:#ff4757;" onclick="deleteEntry()">Delete</button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Google Identity Services script (loaded asynchronously) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        (function() {
            // ========== CONFIGURATION ==========
            const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'; // <-- REPLACE WITH YOUR CLIENT ID
            const DRIVE_FILE_NAME = 'cinevault-data.json';

            // ========== APP STATE ==========
            const state = {
                entries: [],
                currentTab: 'all',
                currentSort: 'newest',
                isGoogleSignedIn: false,
                googleUser: null,
                googleAccessToken: null,
                googleFileId: null,
                theme: 'dark',
                editingEntryId: null,
                selectedRating: 0,
            };

            // ========== DOM ELEMENTS ==========
            const $ = (s) => document.querySelector(s);
            const cardGrid = $('#cardGrid');
            const modalOverlay = $('#modalOverlay');
            const sectionTitle = $('#sectionTitle');
            const toastContainer = $('#toastContainer');
            const starRatingInput = $('#starRatingInput');
            const entryStatusSelect = $('#entryStatus');
            const entryFinishedDate = $('#entryFinishedDate');
            const deleteEntryBtn = $('#deleteEntryBtn');
            const entryIdInput = $('#entryId');
            const entryRatingInput = $('#entryRating');
            const modalTitle = $('#modalTitle');
            const googleSignBtn = $('#googleSignBtn');
            const importFileInput = $('#importFileInput');
            const loadingScreen = $('#loadingScreen');

            // ========== INITIAL LOADING SCREEN ==========
            window.addEventListener('load', () => {
                setTimeout(() => {
                    if (loadingScreen) {
                        loadingScreen.style.opacity = '0';
                        loadingScreen.style.visibility = 'hidden';
                    }
                }, 1200);
            });

            // ========== PARTICLES ==========
            function createParticles() {
                const container = $('#particlesContainer');
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.width = p.style.height = (Math.random() * 6 + 3) + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = (Math.random() * 12 + 8) + 's';
                    p.style.animationDelay = Math.random() * 8 + 's';
                    container.appendChild(p);
                }
            }

            // ========== THEME ==========
            function toggleTheme() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', state.theme);
                localStorage.setItem('cinevault-theme', state.theme);
                showToast(state.theme === 'dark' ? '🌙 Dark mode' : '☀️ Light mode', 'success');
            }

            // ========== TOAST ==========
            function showToast(msg, type = 'success') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.style.cssText = `padding:12px 20px; border-radius:14px; background:var(--toast-bg); color:var(--toast-text); font-weight:600; box-shadow:var(--shadow-lg); margin-top:8px;`;
                toast.textContent = msg;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            // ========== CONFETTI ==========
            function spawnConfetti(count = 60) {
                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.style.cssText = `position:fixed; z-index:250; width:${Math.random()*10+6}px; height:${Math.random()*10+6}px; background:hsl(${Math.random()*360},80%,60%); left:${Math.random()*100}%; top:-20px; border-radius:2px; animation:confettiFall ${Math.random()*2+2}s linear forwards;`;
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 3000);
                }
            }

            // ========== STAR RATING ==========
            function setupStarRating() {
                const stars = starRatingInput.querySelectorAll('span');
                stars.forEach((star, idx) => {
                    star.addEventListener('click', () => {
                        state.selectedRating = idx + 1;
                        entryRatingInput.value = idx + 1;
                        updateStarDisplay(state.selectedRating);
                    });
                    star.addEventListener('mouseenter', () => updateStarDisplay(idx + 1));
                });
                starRatingInput.addEventListener('mouseleave', () => updateStarDisplay(state.selectedRating));
            }

            function updateStarDisplay(rating) {
                const stars = starRatingInput.querySelectorAll('span');
                stars.forEach((star, idx) => {
                    star.style.color = idx < rating ? 'var(--star-filled)' : 'var(--star-empty)';
                });
            }

            // ========== MODAL ==========
            function openAddModal() {
                state.editingEntryId = null;
                entryIdInput.value = '';
                modalTitle.textContent = '✨ Add Entry';
                deleteEntryBtn.style.display = 'none';
                resetForm();
                modalOverlay.style.display = 'flex';
                $('#entryTitle').focus();
            }

            function openEditModal(id) {
                const entry = state.entries.find(e => e.id === id);
                if (!entry) return;
                state.editingEntryId = id;
                entryIdInput.value = id;
                modalTitle.textContent = '✏️ Edit Entry';
                deleteEntryBtn.style.display = 'block';
                $('#entryTitle').value = entry.title;
                $('#entryType').value = entry.type;
                $('#entryStatus').value = entry.status;
                $('#entryStartDate').value = entry.startDate || '';
                $('#entryFinishedDate').value = entry.finishedDate || '';
                $('#entryRemarks').value = entry.remarks || '';
                state.selectedRating = entry.rating || 0;
                entryRatingInput.value = entry.rating || 0;
                updateStarDisplay(entry.rating || 0);
                handleStatusChange();
                modalOverlay.style.display = 'flex';
            }

            function closeModal(e) {
                if (e && e.target !== modalOverlay) return;
                modalOverlay.style.display = 'none';
                state.editingEntryId = null;
            }

            function resetForm() {
                $('#entryTitle').value = '';
                $('#entryType').value = 'movie';
                $('#entryStatus').value = 'watching';
                $('#entryStartDate').value = '';
                $('#entryFinishedDate').value = '';
                $('#entryRemarks').value = '';
                state.selectedRating = 0;
                entryRatingInput.value = 0;
                updateStarDisplay(0);
            }

            function handleStatusChange() {
                entryFinishedDate.style.display = entryStatusSelect.value === 'planning' ? 'none' : 'block';
            }

            // ========== CRUD ==========
            function saveEntry(e) {
                e.preventDefault();
                const title = $('#entryTitle').value.trim();
                if (!title) return showToast('Title required', 'error');
                const entry = {
                    id: state.editingEntryId || 'e_' + Date.now(),
                    title,
                    type: $('#entryType').value,
                    status: $('#entryStatus').value,
                    startDate: $('#entryStartDate').value,
                    finishedDate: $('#entryFinishedDate').value,
                    rating: state.selectedRating,
                    remarks: $('#entryRemarks').value.trim(),
                    createdAt: state.editingEntryId ? (state.entries.find(e => e.id === state.editingEntryId)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
                };
                if (state.editingEntryId) {
                    const idx = state.entries.findIndex(e => e.id === state.editingEntryId);
                    if (idx !== -1) state.entries[idx] = entry;
                } else {
                    state.entries.unshift(entry);
                }
                saveData();
                updateUI();
                renderCards();
                closeModal();
                showToast('✅ Saved!', 'success');
                if (entry.status === 'watched' && entry.rating >= 4) spawnConfetti(80);
            }

            function deleteEntry() {
                if (!state.editingEntryId) return;
                if (!confirm('Delete this entry?')) return;
                state.entries = state.entries.filter(e => e.id !== state.editingEntryId);
                saveData();
                updateUI();
                renderCards();
                closeModal();
                showToast('Deleted', 'info');
            }

            // ========== RENDER ==========
            function renderCards() {
                let filtered = state.currentTab === 'all' ? [...state.entries] : state.entries.filter(e => e.status === state.currentTab);
                // Sort
                const sort = state.currentSort;
                if (sort === 'newest') filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                else if (sort === 'oldest') filtered.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
                else if (sort === 'rating-high') filtered.sort((a,b) => (b.rating||0) - (a.rating||0));
                else if (sort === 'title-asc') filtered.sort((a,b) => a.title.localeCompare(b.title));

                if (filtered.length === 0) {
                    cardGrid.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-tertiary);">📭 No entries yet</div>`;
                } else {
                    cardGrid.innerHTML = filtered.map(e => `
                        <div class="show-card" onclick="openEditModal('${e.id}')">
                            <div style="display:flex; justify-content:space-between;"><strong>${e.title}</strong><span>${e.type==='movie'?'🎥':'📺'}</span></div>
                            <div style="margin:8px 0;">${e.status} | ⭐ ${e.rating||0}/5</div>
                            <div style="font-size:0.8rem;">📅 ${e.startDate||'?'} → ${e.finishedDate||'?'}</div>
                            <div style="margin-top:6px; font-style:italic;">${e.remarks||'No remarks'}</div>
                        </div>`).join('');
                }
            }

            function updateUI() {
                const w = state.entries.filter(e => e.status === 'watching').length;
                const p = state.entries.filter(e => e.status === 'planning').length;
                const d = state.entries.filter(e => e.status === 'watched').length;
                $('#statWatching').textContent = w;
                $('#statPlanning').textContent = p;
                $('#statWatched').textContent = d;
                const rated = state.entries.filter(e => e.rating > 0);
                const avg = rated.length ? (rated.reduce((s,e) => s+e.rating,0)/rated.length).toFixed(1) : '0.0';
                $('#statAvgRating').textContent = avg;
                $('#badgeAll').textContent = state.entries.length;
                $('#badgeWatching').textContent = w;
                $('#badgePlanning').textContent = p;
                $('#badgeWatched').textContent = d;
                sectionTitle.textContent = state.currentTab === 'all' ? 'All Entries' : state.currentTab.charAt(0).toUpperCase() + state.currentTab.slice(1);
            }

            function switchTab(tab) {
                state.currentTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                updateUI();
                renderCards();
            }

            // ========== DATA PERSISTENCE ==========
            function saveData() {
                localStorage.setItem('cinevault-data', JSON.stringify({ entries: state.entries }));
                if (state.isGoogleSignedIn && state.googleAccessToken) saveToDrive();
            }

            function loadFromLocal() {
                const raw = localStorage.getItem('cinevault-data');
                if (raw) state.entries = JSON.parse(raw).entries || [];
            }

            // ========== GOOGLE AUTH ==========
            function handleGoogleSignIn() {
                if (state.isGoogleSignedIn) {
                    signOutGoogle();
                    return;
                }
                if (!GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID')) {
                    const client = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile',
                        callback: (response) => {
                            if (response.access_token) {
                                state.googleAccessToken = response.access_token;
                                state.isGoogleSignedIn = true;
                                localStorage.setItem('cinevault-google-token', response.access_token);
                                fetchUserInfo(response.access_token);
                                showToast('✅ Signed in with Google!', 'success');
                                loadFromDrive();
                            }
                        },
                    });
                    client.requestAccessToken();
                } else {
                    showToast('⚠️ Set your Google Client ID in the code.', 'error');
                }
            }

            function fetchUserInfo(token) {
                fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${token}` } })
                    .then(r => r.json()).then(user => {
                        state.googleUser = user;
                        localStorage.setItem('cinevault-google-user', JSON.stringify(user));
                        updateGoogleUI();
                    });
            }

            function signOutGoogle() {
                state.isGoogleSignedIn = false;
                state.googleAccessToken = null;
                state.googleUser = null;
                state.googleFileId = null;
                localStorage.removeItem('cinevault-google-token');
                localStorage.removeItem('cinevault-google-user');
                localStorage.removeItem('cinevault-google-file-id');
                updateGoogleUI();
                showToast('👋 Signed out', 'info');
            }

            function updateGoogleUI() {
                if (state.isGoogleSignedIn && state.googleUser) {
                    googleSignBtn.innerHTML = `<img src="${state.googleUser.picture}" style="width:24px;height:24px;border-radius:50%;"> ${state.googleUser.given_name || 'User'}`;
                    googleSignBtn.classList.add('signed-in');
                } else {
                    googleSignBtn.innerHTML = '<i class="fa-brands fa-google"></i> <span>Sign In</span>';
                    googleSignBtn.classList.remove('signed-in');
                }
            }

            function saveToDrive() {
                if (!state.googleAccessToken) return;
                const content = JSON.stringify({ entries: state.entries });
                const file = new Blob([content], { type: 'application/json' });
                const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json', parents: ['appDataFolder'] };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', file);

                const url = state.googleFileId ?
                    `https://www.googleapis.com/upload/drive/v3/files/${state.googleFileId}?uploadType=multipart` :
                    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                fetch(url, {
                    method: state.googleFileId ? 'PATCH' : 'POST',
                    headers: { Authorization: `Bearer ${state.googleAccessToken}` },
                    body: form,
                }).then(r => r.json()).then(data => {
                    if (data.id && !state.googleFileId) {
                        state.googleFileId = data.id;
                        localStorage.setItem('cinevault-google-file-id', data.id);
                    }
                }).catch(console.error);
            }

            function loadFromDrive() {
                if (!state.googleAccessToken) return;
                fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}'&spaces=appDataFolder&fields=files(id)`, {
                    headers: { Authorization: `Bearer ${state.googleAccessToken}` }
                }).then(r => r.json()).then(data => {
                    if (data.files?.length) {
                        const fileId = data.files[0].id;
                        state.googleFileId = fileId;
                        localStorage.setItem('cinevault-google-file-id', fileId);
                        return fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                            headers: { Authorization: `Bearer ${state.googleAccessToken}` }
                        });
                    }
                }).then(r => r?.json()).then(cloud => {
                    if (cloud?.entries) {
                        state.entries = cloud.entries;
                        saveToLocal();
                        updateUI();
                        renderCards();
                        showToast('📥 Synced from Google Drive', 'success');
                    }
                }).catch(console.error);
            }

            function exportData() {
                const blob = new Blob([JSON.stringify({ entries: state.entries }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `cinevault-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                showToast('💾 Exported!', 'success');
                spawnConfetti(30);
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.entries) {
                            state.entries = [...data.entries, ...state.entries];
                            saveData();
                            updateUI();
                            renderCards();
                            showToast('📥 Imported!', 'success');
                            spawnConfetti(70);
                        }
                    } catch (ex) { showToast('Invalid file', 'error'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ========== INIT ==========
            function init() {
                const savedTheme = localStorage.getItem('cinevault-theme') || 'dark';
                state.theme = savedTheme;
                document.documentElement.setAttribute('data-theme', savedTheme);
                loadFromLocal();
                const token = localStorage.getItem('cinevault-google-token');
                if (token && GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID')) {
                    state.googleAccessToken = token;
                    state.isGoogleSignedIn = true;
                    fetchUserInfo(token);
                    loadFromDrive();
                }
                createParticles();
                setupStarRating();
                updateUI();
                renderCards();
                document.getElementById('sortSelect').addEventListener('change', (e) => { state.currentSort = e.target.value; renderCards(); });
                window.addEventListener('scroll', () => {
                    document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeModal();
                    if (e.ctrlKey && e.key === 'n') { e.preventDefault(); openAddModal(); }
                });
            }
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
