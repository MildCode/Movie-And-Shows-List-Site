            const fileBlob = new Blob([jsonContent], { type: DRIVE_JSON_MIME });

            const metadata = {
                name: DRIVE_FILE_NAME,
                mimeType: DRIVE_JSON_MIME,
                parents: ['appDataFolder'],
            };

            if (APP_STATE.googleFileId) {
                // Update existing file
                const formData = new FormData();
                formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                formData.append('file', fileBlob);

                fetch(`https://www.googleapis.com/upload/drive/v3/files/${APP_STATE.googleFileId}?uploadType=multipart`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${APP_STATE.googleAccessToken}` },
                        body: formData,
                    })
                    .then(res => res.json())
                    .then(data => {
                        console.log('📤 Synced to Google Drive:', data.id);
                    })
                    .catch(err => {
                        console.error('Failed to sync to Google Drive:', err);
                        // Token may have expired
                        if (err.message.includes('401')) {
                            clearGoogleAuth();
                            showToast('⚠️ Google session expired. Re-sign in to sync.', 'error');
                        }
                    });
            } else {
                // Create new file
                const formData = new FormData();
                formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                formData.append('file', fileBlob);

                fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${APP_STATE.googleAccessToken}` },
                        body: formData,
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.id) {
                            APP_STATE.googleFileId = data.id;
                            localStorage.setItem('cinevault-google-file-id', data.id);
                            console.log('📤 Created & synced to Google Drive:', data.id);
                        }
                    })
                    .catch(err => {
                        console.error('Failed to create file on Google Drive:', err);
                        if (err.message.includes('401')) {
                            clearGoogleAuth();
                            showToast('⚠️ Google session expired. Re-sign in to sync.', 'error');
                        }
                    });
            }
        }

        function loadFromGoogleDrive() {
            if (!APP_STATE.googleAccessToken) return;

            // Search for existing app data file
            fetch(
                    `https://www.googleapis.com/drive/v3/files?q=name='${encodeURIComponent(DRIVE_FILE_NAME)}'&spaces=appDataFolder&fields=files(id,name,modifiedTime)`,
                    {
                        headers: { 'Authorization': `Bearer ${APP_STATE.googleAccessToken}` },
                    }
                )
                .then(res => res.json())
                .then(data => {
                    if (data.files && data.files.length > 0) {
                        const file = data.files[0];
                        APP_STATE.googleFileId = file.id;
                        localStorage.setItem('cinevault-google-file-id', file.id);

                        // Download file content
                        return fetch(
                            `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
                                headers: { 'Authorization': `Bearer ${APP_STATE.googleAccessToken}` },
                            }
                        );
                    } else {
                        console.log('📭 No existing file on Google Drive. Will create on next save.');
                        // Save current local data to Drive
                        saveToGoogleDrive();
                        return null;
                    }
                })
                .then(res => {
                    if (!res) return null;
                    if (!res.ok) throw new Error('Failed to download file');
                    return res.json();
                })
                .then(cloudData => {
                    if (cloudData && cloudData.entries) {
                        // Merge strategy: Use the most recent data
                        const localLastSaved = getLocalLastSaved();
                        const cloudLastSynced = cloudData.lastSynced || '1970-01-01';

                        if (new Date(cloudLastSynced) > new Date(localLastSaved)) {
                            // Cloud data is newer
                            if (confirm(
                                    `📥 Newer data found on Google Drive (${cloudData.entries.length} entries). Load it?`
                                    )) {
                                APP_STATE.entries = cloudData.entries;
                                saveToLocalStorage();
                                updateAllUI();
                                renderCards();
                                showToast('✅ Loaded data from Google Drive!', 'success');
                            }
                        } else if (APP_STATE.entries.length > (cloudData.entries?.length || 0)) {
                            // Local has more entries, push to cloud
                            saveToGoogleDrive();
                        }
                        console.log('📂 Cloud entries:', cloudData.entries.length,
                            '| Local entries:', APP_STATE.entries.length);
                    }
                })
                .catch(err => {
                    console.error('Failed to load from Google Drive:', err);
                    if (err.message.includes('401')) {
                        clearGoogleAuth();
                        showToast('⚠️ Google session expired. Using local data.', 'error');
                    }
                });
        }

        function getLocalLastSaved() {
            try {
                const raw = localStorage.getItem('cinevault-data');
                if (raw) {
                    const data = JSON.parse(raw);
                    return data.lastSaved || '1970-01-01';
                }
            } catch (e) {}
            return '1970-01-01';
        }

        // ==================== UTILITIES ====================
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
            });
        }

        // ==================== SERVICE WORKER REGISTRATION FOR OFFLINE ====================
        if ('serviceWorker' in navigator) {
            // Could register a service worker for full offline support
            // For now, localStorage handles offline data persistence
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', init);

        // ==================== AUTO-SAVE ON PAGE UNLOAD ====================
        window.addEventListener('beforeunload', () => {
            saveToLocalStorage();
        });

        // ==================== PERIODIC AUTO-SAVE ====================
        setInterval(() => {
            if (APP_STATE.entries.length > 0) {
                saveToLocalStorage();
            }
        }, 30000); // Every 30 seconds

        console.log('🎬✨ CineVault ready! All systems initialized.');
        console.log('📋 Features: Watchlist | Google Drive Sync | Light/Dark Mode | Animations | Export/Import');
        console.log('⌨️ Shortcuts: Ctrl+N = New Entry | Esc = Close Modal');
        console.log('💡 Set your Google Client ID in the GOOGLE_CLIENT_ID variable for cloud sync.');
    </script>
</body>
</html>
