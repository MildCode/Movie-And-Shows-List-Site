<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Watchlist Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase SDK (v9 modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, collection, query, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // ========== FIREBASE CONFIGURATION ==========
        // 🔥 REPLACE WITH YOUR FIREBASE PROJECT CONFIGURATION 🔥
        // Get it from https://console.firebase.google.com/
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose globally for use in non-module scripts
        window.__firebase = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, doc, getDoc, setDoc, collection, getDocs, writeBatch };
    </script>

    <style>
        /* ========== ALL EXISTING CSS STYLES ARE PRESERVED ========== */
        :root {
            --bg-primary: #f5f2f0;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0ece9;
            --bg-glass: rgba(255, 255, 255, 0.75);
            --bg-glass-hover: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5e;
            --text-tertiary: #7a7a8e;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.2);
            --card-bg: #ffffff;
            --card-hover-bg: #fdfcfb;
            --input-bg: #f5f2f0;
            --input-border: #e0dcd7;
            --tag-watching: #ff6b6b;
            --tag-planning: #ffa94d;
            --tag-watched: #51cf66;
            --gradient-1: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --gradient-2: linear-gradient(135deg, #ff6b6b, #ffa94d);
            --gradient-3: linear-gradient(135deg, #51cf66, #69db7c);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --toast-bg: #1a1a2e;
            --toast-text: #fff;
            --star-empty: #d0d0d0;
            --star-filled: #ffc107;
            --ripple: rgba(108, 92, 231, 0.3);
            --particle-color: rgba(108, 92, 231, 0.15);
            --scrollbar-thumb: #c0bdb8;
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #222236;
            --bg-glass: rgba(26, 26, 46, 0.75);
            --bg-glass-hover: rgba(30, 30, 55, 0.9);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c0;
            --text-tertiary: #7a7a90;
            --accent: #8b7cf7;
            --accent-light: #b4a7ff;
            --accent-glow: rgba(139, 124, 247, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.6);
            --card-bg: #1e1e35;
            --card-hover-bg: #252540;
            --input-bg: #1a1a2e;
            --input-border: #333350;
            --tag-watching: #ff6b6b;
            --tag-planning: #ffa94d;
            --tag-watched: #51cf66;
            --gradient-1: linear-gradient(135deg, #8b7cf7, #b4a7ff);
            --gradient-2: linear-gradient(135deg, #ff6b6b, #ffa94d);
            --gradient-3: linear-gradient(135deg, #51cf66, #69db7c);
            --nav-bg: rgba(15, 15, 26, 0.85);
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --toast-bg: #e8e8f0;
            --toast-text: #1a1a2e;
            --star-empty: #3a3a55;
            --star-filled: #ffc107;
            --ripple: rgba(139, 124, 247, 0.4);
            --particle-color: rgba(139, 124, 247, 0.12);
            --scrollbar-thumb: #3a3a55;
        }

        /* All existing styles remain unchanged from here... (keeping original styling) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow-x: hidden; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
        .particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; background: var(--particle-color); animation: floatUp linear infinite; opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.2; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        .grid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.03; background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px); background-size: 60px 60px; animation: gridShift 20s linear infinite; }
        @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }
        .app-container { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 0 24px; }
        .navbar { position: sticky; top: 20px; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; margin-top: 20px; background: var(--nav-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-md); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); animation: slideDownNav 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideDownNav { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        .navbar.scrolled { padding: 12px 24px; box-shadow: var(--shadow-lg); border-radius: 16px; }
        .nav-brand { display: flex; align-items: center; gap: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.5rem; cursor: pointer; transition: transform 0.3s ease; }
        .nav-brand .logo-icon { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: var(--gradient-1); color: #fff; font-size: 1.3rem; animation: logoPulse 3s ease-in-out infinite; box-shadow: 0 4px 20px var(--accent-glow); }
        @keyframes logoPulse { 0%,100% { box-shadow: 0 4px 20px var(--accent-glow); } 50% { box-shadow: 0 8px 35px var(--accent-glow), 0 0 60px var(--accent-glow); } }
        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border: none; border-radius: 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; white-space: nowrap; letter-spacing: 0.2px; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--gradient-1); color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }
        .btn-primary:hover { box-shadow: 0 8px 28px var(--accent-glow); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: var(--text-primary); border: 2px solid var(--border); }
        .btn-outline:hover { border-color: var(--accent); background: var(--bg-glass-hover); transform: translateY(-2px); }
        .btn-icon { width: 42px; height: 42px; padding: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; background: var(--bg-glass); border: 1px solid var(--border); color: var(--text-primary); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-icon:hover { background: var(--bg-glass-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .theme-toggle { width: 48px; height: 48px; border-radius: 14px; background: var(--bg-glass); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; color: var(--text-primary); }
        .theme-toggle:hover { transform: rotate(20deg) scale(1.05); }
        .google-btn, .account-btn { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--bg-glass); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; font-weight: 600; color: var(--text-primary); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; }
        .account-btn:hover { background: var(--bg-glass-hover); transform: translateY(-2px); }
        .account-btn.signed-in { background: var(--gradient-1); color: #fff; border: none; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .main-content { margin-top: 32px; animation: fadeInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .stats-bar { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
        .stat-card { flex: 1; min-width: 140px; padding: 20px 24px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; text-align: center; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; box-shadow: var(--shadow-sm); animation: cardAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes cardAppear { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .stat-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--accent-light); }
        .stat-card .stat-number { font-family: 'Space Grotesk', sans-serif; font-size: 2.4rem; font-weight: 700; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .tabs-container { display: flex; gap: 6px; margin-bottom: 24px; background: var(--bg-tertiary); padding: 6px; border-radius: 16px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 100px; padding: 14px 20px; border: none; background: transparent; border-radius: 12px; cursor: pointer; font-weight: 600; color: var(--text-secondary); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-btn.active { background: var(--card-bg); color: var(--text-primary); box-shadow: var(--shadow-sm); animation: tabPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes tabPop { 0% { transform: scale(0.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
        .tab-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-left: 8px; background: var(--accent-light); color: #fff; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; min-height: 200px; }
        .show-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 24px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
        .show-card:hover { transform: translateY(-8px) rotateX(2deg); box-shadow: var(--shadow-xl); border-color: var(--accent-light); background: var(--card-hover-bg); }
        .modal-overlay { position: fixed; inset: 0; background: var(--modal-overlay); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s ease; backdrop-filter: blur(4px); }
        .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 24px; padding: 32px; width: 100%; max-width: 550px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: modalSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalSlideIn { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-primary); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem; transition: all 0.3s ease; }
        .star-rating-input { display: flex; gap: 4px; font-size: 2rem; cursor: pointer; }
        .star-rating-input .star-input { color: var(--star-empty); transition: all 0.2s ease; cursor: pointer; }
        .star-rating-input .star-input.active { color: var(--star-filled); transform: scale(1.2); filter: drop-shadow(0 0 6px rgba(255, 193, 7, 0.6)); }
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 14px 22px; border-radius: 14px; background: var(--toast-bg); color: var(--toast-text); font-weight: 600; box-shadow: var(--shadow-lg); animation: toastIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.4s ease 2.5s forwards; display: flex; align-items: center; gap: 10px; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(80px); } }
        .confetti-piece { position: fixed; z-index: 250; pointer-events: none; animation: confettiFall linear forwards; }
        @keyframes confettiFall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } }
        @media (max-width: 768px) { .card-grid { grid-template-columns: 1fr; } .stat-card { padding: 14px 16px; } .navbar { padding: 12px 16px; } }
        /* Additional auth modal styles */
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .auth-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; border-radius: 10px; transition: all 0.2s; font-weight: 600; }
        .auth-tab.active { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="particles-container" id="particlesContainer"></div>
<div class="grid-bg"></div>

<div class="app-container">
    <nav class="navbar" id="navbar">
        <div class="nav-brand" onclick="location.reload()">
            <div class="logo-icon">🎬</div>
            <span>CineVault</span>
        </div>
        <div class="nav-actions">
            <button class="account-btn" id="accountBtn" onclick="openAuthModal()">
                <i class="fa-regular fa-user"></i> <span id="accountBtnText">Sign In</span>
            </button>
            <button class="btn-icon" id="exportBtn" onclick="exportData()" title="Export JSON">
                <i class="fa-solid fa-download"></i>
            </button>
            <button class="btn-icon" id="importBtn" onclick="document.getElementById('importFileInput').click()" title="Import JSON">
                <i class="fa-solid fa-upload"></i>
            </button>
            <input type="file" id="importFileInput" accept=".json" style="display:none">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                <i class="fa-solid fa-sun icon-sun"></i>
                <i class="fa-solid fa-moon icon-moon"></i>
            </button>
        </div>
    </nav>

    <div class="main-content">
        <div class="stats-bar" id="statsBar">
            <div class="stat-card" onclick="switchTab('watching')"><span class="stat-icon">👀</span><div class="stat-number watching" id="statWatching">0</div><div class="stat-label">Currently Watching</div></div>
            <div class="stat-card" onclick="switchTab('planning')"><span class="stat-icon">📋</span><div class="stat-number" id="statPlanning">0</div><div class="stat-label">Planned</div></div>
            <div class="stat-card watched" onclick="switchTab('watched')"><span class="stat-icon">✅</span><div class="stat-number watched" id="statWatched">0</div><div class="stat-label">Completed</div></div>
            <div class="stat-card"><span class="stat-icon">⭐</span><div class="stat-number" id="statAvgRating">0.0</div><div class="stat-label">Avg Rating</div></div>
        </div>
        <div class="tabs-container"><button class="tab-btn active" data-tab="all" onclick="switchTab('all')">📺 All <span class="tab-badge" id="badgeAll">0</span></button><button class="tab-btn" data-tab="watching" onclick="switchTab('watching')">👀 Watching <span class="tab-badge" id="badgeWatching">0</span></button><button class="tab-btn" data-tab="planning" onclick="switchTab('planning')">📋 Planning <span class="tab-badge" id="badgePlanning">0</span></button><button class="tab-btn" data-tab="watched" onclick="switchTab('watched')">✅ Watched <span class="tab-badge" id="badgeWatched">0</span></button></div>
        <div class="section-header"><h2 class="section-title" id="sectionTitle">All Entries</h2><div style="display:flex;gap:10px;"><select class="sort-select" id="sortSelect"><option value="newest">🕐 Newest First</option><option value="oldest">📅 Oldest First</option><option value="rating-high">⭐ Rating: High to Low</option><option value="rating-low">⭐ Rating: Low to High</option><option value="title-asc">🔤 Title: A-Z</option><option value="title-desc">🔤 Title: Z-A</option></select><button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add New</button></div></div>
        <div class="card-grid" id="cardGrid"></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)"><div class="modal" id="modal" onclick="event.stopPropagation()"><div class="modal-header"><h3 class="modal-title" id="modalTitle">Add New Entry</h3><button class="modal-close" onclick="closeModal()">✕</button></div><form id="entryForm" onsubmit="saveEntry(event)"><input type="hidden" id="entryId"><div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-input" id="entryTitle" required></div><div class="form-row"><div class="form-group"><label class="form-label">Type</label><select class="form-select" id="entryType"><option value="movie">🎥 Movie</option><option value="show">📺 TV Show</option></select></div><div class="form-group"><label class="form-label">Status</label><select class="form-select" id="entryStatus"><option value="watching">👀 Watching</option><option value="planning">📋 Planning</option><option value="watched">✅ Watched</option></select></div></div><div class="form-row"><div class="form-group"><label class="form-label">Start Date</label><input type="date" class="form-input" id="entryStartDate"></div><div class="form-group"><label class="form-label">Finished Date</label><input type="date" class="form-input" id="entryFinishedDate"></div></div><div class="form-group"><label class="form-label">Rating</label><div class="star-rating-input" id="starRatingInput"><span class="star-input" data-rating="1">★</span><span class="star-input" data-rating="2">★</span><span class="star-input" data-rating="3">★</span><span class="star-input" data-rating="4">★</span><span class="star-input" data-rating="5">★</span></div><input type="hidden" id="entryRating" value="0"></div><div class="form-group"><label class="form-label">Remarks</label><textarea class="form-textarea" id="entryRemarks" placeholder="Add your thoughts..."></textarea></div><button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">Save Entry</button><button type="button" class="btn btn-outline" id="deleteEntryBtn" style="width:100%;display:none;margin-top:8px;color:#ff4757;" onclick="deleteEntry()">Delete Entry</button></form></div></div>

<div class="toast-container" id="toastContainer"></div>

<script>
    // APP STATE (removed Google Drive, added Firebase sync)
    const APP_STATE = { entries: [], currentTab: 'all', currentSort: 'newest', isCloudSignedIn: false, cloudUser: null, editingEntryId: null, selectedRating: 0 };
    let firebaseReady = false, currentFirebaseUser = null;

    function showToast(msg, type = 'success') { const toast = document.createElement('div'); toast.className = `toast ${type}`; toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span> ${msg}`; document.getElementById('toastContainer').appendChild(toast); setTimeout(() => toast.remove(), 3000); }
    function spawnConfetti(count = 60) { for (let i = 0; i < count; i++) { const piece = document.createElement('div'); piece.className = 'confetti-piece'; piece.style.left = Math.random() * 100 + '%'; piece.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`; piece.style.width = Math.random() * 10 + 6 + 'px'; piece.style.height = Math.random() * 10 + 6 + 'px'; piece.style.animationDuration = Math.random() * 2 + 2.5 + 's'; document.body.appendChild(piece); setTimeout(() => piece.remove(), 4000); } }
    function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    function formatDate(dateStr) { if (!dateStr) return '—'; return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
    function generateId() { return 'entry_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }

    // LocalStorage helpers
    function saveToLocalStorage() { localStorage.setItem('cinevault-data', JSON.stringify({ entries: APP_STATE.entries, lastSaved: new Date().toISOString() })); }
    function loadFromLocalStorage() { const raw = localStorage.getItem('cinevault-data'); if (raw) { const data = JSON.parse(raw); if (data.entries) APP_STATE.entries = data.entries; } }

    // Sync to Firebase (when logged in)
    async function syncEntriesToFirebase() { if (!currentFirebaseUser) return; try { const { db, doc, setDoc, getFirestore } = window.__firebase; const userDocRef = doc(db, 'users', currentFirebaseUser.uid); await setDoc(userDocRef, { entries: APP_STATE.entries, lastSynced: new Date().toISOString() }, { merge: true }); console.log('✅ Synced to Firebase'); } catch(e) { console.error('Firebase sync error', e); showToast('Sync failed', 'error'); } }
    async function loadEntriesFromFirebase() { if (!currentFirebaseUser) return false; try { const { db, doc, getDoc } = window.__firebase; const userDoc = await getDoc(doc(db, 'users', currentFirebaseUser.uid)); if (userDoc.exists() && userDoc.data().entries) { const cloudEntries = userDoc.data().entries; if (cloudEntries.length > 0 || APP_STATE.entries.length === 0) { APP_STATE.entries = cloudEntries; saveToLocalStorage(); updateAllUI(); renderCards(); showToast(`📡 Loaded ${cloudEntries.length} entries from cloud`, 'success'); return true; } } return false; } catch(e) { console.warn('Firebase load error', e); return false; } }

    // Save wrapper (local + cloud)
    async function saveData() { saveToLocalStorage(); if (currentFirebaseUser) await syncEntriesToFirebase(); }
    // CRUD core
    function saveEntry(event) { event.preventDefault(); const title = document.getElementById('entryTitle').value.trim(); if (!title) return showToast('Title required', 'error'); const entry = { id: APP_STATE.editingEntryId || generateId(), title, type: document.getElementById('entryType').value, status: document.getElementById('entryStatus').value, startDate: document.getElementById('entryStartDate').value, finishedDate: document.getElementById('entryFinishedDate').value, rating: APP_STATE.selectedRating, remarks: document.getElementById('entryRemarks').value.trim(), createdAt: APP_STATE.editingEntryId ? (APP_STATE.entries.find(e => e.id === APP_STATE.editingEntryId)?.createdAt || new Date().toISOString()) : new Date().toISOString(), updatedAt: new Date().toISOString() }; if (APP_STATE.editingEntryId) { const idx = APP_STATE.entries.findIndex(e => e.id === APP_STATE.editingEntryId); if (idx !== -1) APP_STATE.entries[idx] = entry; showToast('✅ Entry updated'); } else { APP_STATE.entries.unshift(entry); showToast('🎉 Added!'); spawnConfetti(30); if (entry.status === 'watched' && entry.rating >= 4) setTimeout(() => spawnConfetti(60), 200); } saveData(); updateAllUI(); renderCards(); closeModal(); }
    function deleteEntry() { if (!APP_STATE.editingEntryId) return; if (!confirm('Delete forever?')) return; APP_STATE.entries = APP_STATE.entries.filter(e => e.id !== APP_STATE.editingEntryId); saveData(); updateAllUI(); renderCards(); closeModal(); showToast('Deleted', 'info'); }
    function openAddModal() { APP_STATE.editingEntryId = null; document.getElementById('entryId').value = ''; document.getElementById('modalTitle').textContent = '✨ Add New Entry'; document.getElementById('deleteEntryBtn').style.display = 'none'; resetForm(); document.getElementById('modalOverlay').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
    function openEditModal(id) { const entry = APP_STATE.entries.find(e => e.id === id); if (!entry) return; APP_STATE.editingEntryId = id; document.getElementById('entryId').value = id; document.getElementById('modalTitle').textContent = '✏️ Edit Entry'; document.getElementById('deleteEntryBtn').style.display = 'block'; document.getElementById('entryTitle').value = entry.title; document.getElementById('entryType').value = entry.type; document.getElementById('entryStatus').value = entry.status; document.getElementById('entryStartDate').value = entry.startDate || ''; document.getElementById('entryFinishedDate').value = entry.finishedDate || ''; document.getElementById('entryRemarks').value = entry.remarks || ''; APP_STATE.selectedRating = entry.rating || 0; document.getElementById('entryRating').value = entry.rating || 0; updateStarDisplay(entry.rating || 0); document.getElementById('modalOverlay').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
    function resetForm() { document.getElementById('entryTitle').value = ''; document.getElementById('entryType').value = 'movie'; document.getElementById('entryStatus').value = 'watching'; document.getElementById('entryStartDate').value = ''; document.getElementById('entryFinishedDate').value = ''; document.getElementById('entryRemarks').value = ''; resetStarRating(); }
    function closeModal(e) { if (e && e.target !== document.getElementById('modalOverlay')) return; document.getElementById('modalOverlay').style.display = 'none'; document.body.style.overflow = ''; APP_STATE.editingEntryId = null; }
    function updateStarDisplay(rating) { document.querySelectorAll('.star-input').forEach((star, idx) => { if (idx < rating) star.classList.add('active'); else star.classList.remove('active'); }); }
    function resetStarRating() { APP_STATE.selectedRating = 0; document.getElementById('entryRating').value = 0; updateStarDisplay(0); }
    function setupStarRating() { document.querySelectorAll('.star-input').forEach(star => { star.addEventListener('click', () => { APP_STATE.selectedRating = parseInt(star.dataset.rating); document.getElementById('entryRating').value = APP_STATE.selectedRating; updateStarDisplay(APP_STATE.selectedRating); }); star.addEventListener('mouseenter', () => updateStarDisplay(parseInt(star.dataset.rating))); }); document.getElementById('starRatingInput').addEventListener('mouseleave', () => updateStarDisplay(APP_STATE.selectedRating)); }

    // Rendering
    function getFilteredEntries() { if (APP_STATE.currentTab === 'all') return [...APP_STATE.entries]; return APP_STATE.entries.filter(e => e.status === APP_STATE.currentTab); }
    function getSortedEntries(entries) { const sort = document.getElementById('sortSelect').value; APP_STATE.currentSort = sort; const sorted = [...entries]; if (sort === 'newest') return sorted.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)); if (sort === 'oldest') return sorted.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)); if (sort === 'rating-high') return sorted.sort((a,b) => (b.rating||0) - (a.rating||0)); if (sort === 'rating-low') return sorted.sort((a,b) => (a.rating||0) - (b.rating||0)); if (sort === 'title-asc') return sorted.sort((a,b) => a.title.localeCompare(b.title)); if (sort === 'title-desc') return sorted.sort((a,b) => b.title.localeCompare(a.title)); return sorted; }
    function renderCards() { const filtered = getFilteredEntries(); const sorted = getSortedEntries(filtered); const grid = document.getElementById('cardGrid'); if (sorted.length === 0) { grid.innerHTML = `<div class="empty-state-content"><span class="empty-state-icon">📭</span><p class="empty-state-text">No entries yet</p><p style="color:var(--text-tertiary);">Click "Add New" or Ctrl+N</p></div>`; return; } grid.innerHTML = sorted.map(entry => `<div class="show-card" onclick="openEditModal('${entry.id}')"><div class="card-glow"></div><div class="card-header"><h3 class="card-title">${escapeHTML(entry.title)}</h3><span class="card-type-badge ${entry.type === 'movie' ? 'badge-movie' : 'badge-show'}">${entry.type === 'movie' ? '🎥 Movie' : '📺 Show'}</span></div><div class="card-status status-${entry.status}"><span class="status-dot"></span> ${entry.status === 'watching' ? '👀 Watching' : entry.status === 'planning' ? '📋 Planned' : '✅ Watched'}</div><div class="card-dates"><span>📅 Start: ${formatDate(entry.startDate)}</span><span>🏁 Finish: ${formatDate(entry.finishedDate)}</span></div><div class="card-rating">${Array(5).fill().map((_,i) => `<span class="star ${i < (entry.rating||0) ? '' : 'empty'}">★</span>`).join('')} <span style="font-size:0.8rem;">${entry.rating||0}/5</span></div><div class="card-remarks">💬 "${escapeHTML(entry.remarks || 'No remarks')}"</div><div class="card-actions" onclick="event.stopPropagation()"><button class="btn btn-sm btn-outline" onclick="openEditModal('${entry.id}')"><i class="fa-solid fa-pen"></i> Edit</button><button class="btn btn-sm btn-outline" style="color:#ff4757;" onclick="quickDelete('${entry.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join(''); }
    function quickDelete(id) { if (confirm('Delete?')) { APP_STATE.entries = APP_STATE.entries.filter(e => e.id !== id); saveData(); updateAllUI(); renderCards(); showToast('Deleted'); } }
    function updateAllUI() { const watching = APP_STATE.entries.filter(e => e.status === 'watching').length, planning = APP_STATE.entries.filter(e => e.status === 'planning').length, watched = APP_STATE.entries.filter(e => e.status === 'watched').length, total = APP_STATE.entries.length, rated = APP_STATE.entries.filter(e => e.rating > 0), avg = rated.length ? (rated.reduce((s,e)=>s+e.rating,0)/rated.length).toFixed(1) : '0.0'; document.getElementById('statWatching').innerText = watching; document.getElementById('statPlanning').innerText = planning; document.getElementById('statWatched').innerText = watched; document.getElementById('statAvgRating').innerText = avg; document.getElementById('badgeAll').innerText = total; document.getElementById('badgeWatching').innerText = watching; document.getElementById('badgePlanning').innerText = planning; document.getElementById('badgeWatched').innerText = watched; const titles = { all: 'All Entries', watching: 'Currently Watching', planning: 'Planning to Watch', watched: 'Completed' }; document.getElementById('sectionTitle').innerText = titles[APP_STATE.currentTab]; }
    function switchTab(tab) { APP_STATE.currentTab = tab; document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab)); updateAllUI(); renderCards(); }
    function exportData() { const blob = new Blob([JSON.stringify({ entries: APP_STATE.entries, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cinevault-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('Exported!'); }
    async function importData(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (e) => { try { const data = JSON.parse(e.target.result); if (data.entries && Array.isArray(data.entries)) { if (confirm(`Import ${data.entries.length} entries? Merging...`)) { const existingIds = new Set(APP_STATE.entries.map(ent => ent.id)); const newOnes = data.entries.filter(ent => !existingIds.has(ent.id)); APP_STATE.entries = [...newOnes, ...APP_STATE.entries]; await saveData(); updateAllUI(); renderCards(); showToast(`✅ Imported ${newOnes.length} entries`); if(newOnes.length) spawnConfetti(); } } else showToast('Invalid file', 'error'); } catch(err) { showToast('Invalid JSON', 'error'); } }; reader.readAsText(file); event.target.value = ''; }

    // Particles & Theme
    function createParticles() { for(let i=0;i<35;i++){ const p=document.createElement('div'); p.className='particle'; p.style.width=Math.random()*8+3+'px'; p.style.height=p.style.width; p.style.left=Math.random()*100+'%'; p.style.animationDuration=Math.random()*15+10+'s'; p.style.animationDelay=Math.random()*10+'s'; p.style.background=['#6c5ce7','#a29bfe','#ff6b6b','#ffa94d','#51cf66'][Math.floor(Math.random()*5)]; document.getElementById('particlesContainer').appendChild(p); } }
    function toggleTheme() { const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', newTheme); localStorage.setItem('cinevault-theme', newTheme); showToast(`${newTheme === 'dark' ? '🌙 Dark' : '☀️ Light'} mode`); }
    function initTheme() { const saved = localStorage.getItem('cinevault-theme') || 'dark'; document.documentElement.setAttribute('data-theme', saved); }

    // Firebase Auth UI & State management
    let authModalOpen = false;
    function openAuthModal() { if (currentFirebaseUser) { signOutFirebase(); return; } showAuthDialog(); }
    function showAuthDialog() { const modalDiv = document.createElement('div'); modalDiv.className = 'modal-overlay'; modalDiv.style.display = 'flex'; modalDiv.innerHTML = `<div class="modal" style="max-width:450px;"><div class="modal-header"><h3><i class="fa-regular fa-user"></i> CineVault Account</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div><div class="auth-tabs"><div class="auth-tab active" data-auth="login">Sign In</div><div class="auth-tab" data-auth="signup">Create Account</div></div><form id="authForm"><div class="form-group"><label>Email</label><input type="email" id="authEmail" class="form-input" required></div><div class="form-group"><label>Password</label><input type="password" id="authPassword" class="form-input" required></div><button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Continue</button></form><p style="margin-top:14px;font-size:0.8rem;text-align:center;">Sync your watchlist across devices</p></div>`; document.body.appendChild(modalDiv); const tabs = modalDiv.querySelectorAll('.auth-tab'); const form = modalDiv.querySelector('#authForm'); let mode = 'login'; tabs.forEach(t => t.onclick = () => { tabs.forEach(tt => tt.classList.remove('active')); t.classList.add('active'); mode = t.dataset.auth; }); form.onsubmit = async (e) => { e.preventDefault(); const email = modalDiv.querySelector('#authEmail').value; const pwd = modalDiv.querySelector('#authPassword').value; try { const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.__firebase; if (mode === 'login') await signInWithEmailAndPassword(auth, email, pwd); else await createUserWithEmailAndPassword(auth, email, pwd); modalDiv.remove(); showToast('Signed in! Syncing data...'); } catch(err) { showToast(err.message, 'error'); } }; }
    async function signOutFirebase() { try { await window.__firebase.signOut(window.__firebase.auth); showToast('Signed out'); } catch(e) { showToast('Sign out failed', 'error'); } }
    function updateAccountUI(user) { const btn = document.getElementById('accountBtnText'); const container = document.getElementById('accountBtn'); if (user) { btn.innerText = user.email?.split('@')[0] || 'Account'; container.classList.add('signed-in'); container.innerHTML = `<i class="fa-regular fa-circle-check"></i> <span>${user.email?.split('@')[0]}</span>`; } else { btn.innerText = 'Sign In'; container.classList.remove('signed-in'); container.innerHTML = `<i class="fa-regular fa-user"></i> <span>Sign In</span>`; } }

    // Firestore sync init
    async function initFirebaseSync() { const { auth, onAuthStateChanged } = window.__firebase; onAuthStateChanged(auth, async (user) => { currentFirebaseUser = user; updateAccountUI(user); if (user) { const loaded = await loadEntriesFromFirebase(); if (!loaded && APP_STATE.entries.length) await syncEntriesToFirebase(); updateAllUI(); renderCards(); } else { if (APP_STATE.entries.length === 0) loadFromLocalStorage(); updateAllUI(); renderCards(); } }); }

    document.getElementById('sortSelect').addEventListener('change', () => renderCards());
    document.getElementById('importFileInput').addEventListener('change', importData);
    window.openAddModal = openAddModal; window.openEditModal = openEditModal; window.closeModal = closeModal; window.saveEntry = saveEntry; window.deleteEntry = deleteEntry; window.switchTab = switchTab; window.exportData = exportData; window.toggleTheme = toggleTheme; window.openAuthModal = openAuthModal; window.quickDelete = quickDelete;
    document.addEventListener('DOMContentLoaded', () => { initTheme(); createParticles(); loadFromLocalStorage(); updateAllUI(); renderCards(); setupStarRating(); initFirebaseSync(); document.querySelectorAll('.btn, .btn-icon, .account-btn').forEach(btn => btn.addEventListener('click', (e) => { const ripple = document.createElement('span'); ripple.className = 'ripple-effect'; const rect = btn.getBoundingClientRect(); const size = Math.max(rect.width, rect.height); ripple.style.width = ripple.style.height = size + 'px'; ripple.style.left = (e.clientX - rect.left - size/2) + 'px'; ripple.style.top = (e.clientY - rect.top - size/2) + 'px'; btn.appendChild(ripple); setTimeout(() => ripple.remove(), 600); })); window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50)); document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); if (e.ctrlKey && e.key === 'n') { e.preventDefault(); openAddModal(); } }); });
</script>
</body>
</html>
